# Launcher stack
fossify-commons = { module = "org.fossify:commons", version.ref = "fossifyCommons" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
googleservices = { id = "com.google.gms.google-services", version.ref = "playservice" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebasecrashlytic" }



